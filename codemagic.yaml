workflows:
  default-workflow:
    name: Default Workflow
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Configure Gradle properties to handle SDK/metadata
        script: |
          echo "android.injected.testOnly=false" >> android/gradle.properties
      - name: Get packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release --no-pub
    artifacts:
      - build/app/outputs/flutter-apk/*.apk