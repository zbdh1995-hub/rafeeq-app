name: rafeeq
description: "Rafeeq AI - Life & Study OS"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # الأيقونات والخطوط والرسوم البيانية
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  fl_chart: ^0.69.0
  intl: any

  # مكتبات Firebase (هنفعلها أول ما نربط المشروع)
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_auth: ^5.3.1

  # الذكاء الاصطناعي Gemini + الصوت والمايكروفون
  google_generative_ai: ^0.4.6
  flutter_tts: ^4.0.2
  speech_to_text: ^7.0.0

  # قارئ المحاضرات PDF واختيار الملفات والصور
  pdfrx: ^1.0.84
  file_picker: ^8.1.2
  image_picker: ^1.1.2
  shared_preferences: ^2.3.2
  http: ^1.2.2
  package_info_plus: ^8.0.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true